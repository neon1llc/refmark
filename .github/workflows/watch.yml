name: watch

# Every Monday, checks each source neon1 cites (watch/neon1.json) against its accepted state and
# opens one issue, or comments on the open one, listing what changed, broke, or moved
on:
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# One run at a time, so two runs never race on the same issue
concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Snapshots of accepted text stay in the Actions cache, never in the repository, because they
      # are copies of other people's pages. They let the report show what changed, not only that it did.
      - name: Restore snapshots
        uses: actions/cache@v4
        with:
          path: watch/.refmark
          key: refmark-snapshots-${{ github.run_id }}
          restore-keys: refmark-snapshots-

      # Exit codes: 0 all sources match, 1 something needs review, 2 the run itself failed
      - name: Check sources
        id: check
        run: |
          set +e
          node bin/refmark.mjs check --manifest watch/neon1.json --report report.md \
            --link-base 'https://github.com/{head}/blob/HEAD/{rest}'
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the issue
        if: steps.check.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Cited sources need review
        run: |
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file report.md
          else
            gh issue create --title "$TITLE" --body-file report.md
          fi

      - name: Fail when the check could not run
        if: steps.check.outputs.status == '2'
        run: exit 1
